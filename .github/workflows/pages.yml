name: Deploy to GitHub Pages

# Manual only. GitHub Pages is not enabled on this repo — a private repo needs a
# paid plan for it. Enable Pages (Settings > Pages > Source: GitHub Actions), or
# make the repo public, then run this workflow by hand.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # The site is static and needs no build step.
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
